name: weather_fusion
description: Multi-source weather app with data fusion, confidence score and short-term nowcast.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  geolocator: ">=13.0.0 <15.0.0"
  sensors_plus: ">=6.0.0 <8.0.0"
  connectivity_plus: ">=6.0.0 <8.0.0"
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  fl_chart: ">=0.69.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
